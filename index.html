<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Configuración para que parezca una App Nativa en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>iPod Code Editor</title>


  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodeEdit">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, HelveticaNeue, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #252526;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 14px;
      margin: 0;
      color: #4ec9b0;
    }
    .header-btns {
      display: flex;
      gap: 5px;
    }
    .btn-action {
      background: #0e639c;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn-action:active { background: #1177bb; }
    input[type="file"] { display: none; }
    
    .editor-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 5px;
    }
    textarea {
      flex: 1;
      background-color: #1e1e1e;
      color: #9cdcfe;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      -webkit-appearance: none;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      gap: 5px;
    }
    .btn-tool {
      flex: 1;
      background: #333;
      color: #fff;
      border: none;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-tool:active { background: #444; }
  </style>
</head>
<body>

  <header>
    <h1>CodeEditor</h1>
    <div class="header-btns">
      <label class="btn-action" for="fileInput">Abrir</label>
      <input type="file" id="fileInput" accept=".html,.js,.css,.txt,*" onchange="cargarArchivo(event)">
      <button class="btn-action" onclick="guardarArchivo()">Guardar</button>
    </div>
  </header>

  <div class="editor-body">
    <textarea id="codigoArea" placeholder="// Escribe o pega tu código aquí..."></textarea>
    
    <div class="toolbar">
      <button class="btn-tool" onclick="limpiar()">Limpiar</button>
      <button class="btn-tool" onclick="ejecutarVistaPrevia()">▶ Ejecutar HTML</button>
    </div>
  </div>

  <script>
    function cargarArchivo(e) {
      var reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('codigoArea').value = event.target.result;
      };
      if (e.target.files[0]) {
        reader.readAsText(e.target.files[0]);
      }
    }

    function guardarArchivo() {
      var texto = document.getElementById('codigoArea').value;
      var blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
      var enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = 'codigo_editado.txt';
      enlace.click();
    }

    function limpiar() {
      if (confirm('¿Borrar todo el código?')) {
        document.getElementById('codigoArea').value = '';
      }
    }

    function ejecutarVistaPrevia() {
      var codigo = document.getElementById('codigoArea').value;
      var ventana = window.open();
      ventana.document.open();
      ventana.document.write(codigo);
      ventana.document.close();
    }
  </script>
</body>
</html>
