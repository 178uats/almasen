<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPod MP3 Local Player</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, HelveticaNeue, sans-serif;
      background-color: #121216;
      color: #ffffff;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a3a;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      color: #00b0ff;
    }
    header p {
      font-size: 11px;
      color: #8a8a9e;
      margin: 4px 0 0 0;
    }
    .upload-section {
      background: #1a1a24;
      border: 2px dashed #00b0ff;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }
    .btn-upload {
      background: linear-gradient(45deg, #00b0ff, #0072ff);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      cursor: pointer;
    }
    input[type="file"] { display: none; }
    
    /* Reproductor Actual */
    .player-card {
      background: #1a1a24;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #2a2a3a;
      text-align: center;
    }
    .song-title {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
      color: #00b0ff;
    }
    audio {
      width: 100%;
      height: 35px;
      outline: none;
    }

    /* Lista de Canciones */
    .playlist-container {
      flex: 1;
      overflow-y: auto;
      background: #16161f;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #222230;
    }
    .playlist-title {
      font-size: 11px;
      color: #777;
      margin-bottom: 6px;
      font-weight: bold;
      padding-left: 4px;
    }
    .song-item {
      background: #1e1e2c;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2a2a3a;
    }
    .song-info {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }
    .song-btns {
      display: flex;
      gap: 5px;
    }
    .btn-sm {
      padding: 5px 8px;
      font-size: 10px;
      border-radius: 4px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-play { background: #00b0ff; color: #000; }
    .btn-delete { background: #ff3333; color: #fff; }
    .empty-state {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>iPod MP3 Player</h1>
    <p>Reproduce tus archivos MP3 locales del dispositivo</p>
  </header>

  <div class="upload-section">
    <label class="btn-upload" for="mp3Input">+ Cargar Archivos MP3</label>
    <input type="file" id="mp3Input" accept="audio/mp3,audio/*" multiple onchange="cargarMp3s(event)">
  </div>

  <!-- Tarjeta de reproducción actual -->
  <div class="player-card">
    <div class="song-title" id="currentSongTitle">Ninguna canción seleccionada</div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <div class="playlist-container">
    <div class="playlist-title">Mi Música Local:</div>
    <div id="playlist">
      <div class="empty-state">No hay canciones cargadas</div>
    </div>
  </div>

  <script>
    var listaCanciones = [];

    window.onload = function() {
      // Cargar música guardada previamente en el dispositivo si existe
      var guardadas = localStorage.getItem('ipod_mp3s');
      if (guardadas) {
        try {
          listaCanciones = JSON.parse(guardadas);
          renderizarPlaylist();
        } catch(e) {
          listaCanciones = [];
        }
      }
    };

    function cargarMp3s(e) {
      var files = e.target.files;
      if (!files.length) return;

      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var reader = new FileReader();

        reader.onload = (function(f) {
          return function(e) {
            listaCanciones.push({
              nombre: f.name,
              url: e.target.result
            });
            guardarEnDispositivo();
            renderizarPlaylist();
          };
        })(file);

        reader.readAsDataURL(file);
      }
    }

    function guardarEnDispositivo() {
      try {
        localStorage.setItem('ipod_mp3s', JSON.stringify(listaCanciones));
      } catch(err) {
        alert('El espacio de almacenamiento local se ha llenado.');
      }
    }

    function renderizarPlaylist() {
      var container = document.getElementById('playlist');
      if (listaCanciones.length === 0) {
        container.innerHTML = '<div class="empty-state">No hay canciones cargadas</div>';
        return;
      }

      container.innerHTML = '';
      for (var i = 0; i < listaCanciones.length; i++) {
        var song = listaCanciones[i];
        var div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = 
          '<div class="song-info">' + song.nombre + '</div>' +
          '<div class="song-btns">' +
            '<button class="btn-sm btn-play" onclick="reproducir(' + i + ')"> ▶ </button>' +
            '<button class="btn-sm btn-delete" onclick="eliminar(' + i + ')"> X </button>' +
          '</div>';
        container.appendChild(div);
      }
    }

    function reproducir(index) {
      var song = listaCanciones[index];
      var player = document.getElementById('audioPlayer');
      var title = document.getElementById('currentSongTitle');

      title.innerText = song.nombre;
      player.src = song.url;
      player.play();
    }

    function eliminar(index) {
      if (confirm('¿Eliminar esta canción de la lista?')) {
        listaCanciones.splice(index, 1);
        guardarEnDispositivo();
        renderizarPlaylist();
      }
    }
  </script>
</body>
</html>
