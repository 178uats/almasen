<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lark iPod Player</title>

  <!-- Favicon ultraligero compatible con GitHub Pages -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">

  <!-- Configuración Web App para iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LarkPlayer">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, HelveticaNeue, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1a1a24;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      color: #00f2fe;
    }
    .btn-file {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    input[type="file"] { display: none; }

    /* Visualizador y Carátula */
    .player-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      position: relative;
    }
    .disc-container {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #252538;
      border: 4px solid #00f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0,242,254,0.3);
      margin-bottom: 15px;
    }
    .disc-icon {
      font-size: 50px;
    }
    canvas {
      width: 100%;
      height: 40px;
      margin-bottom: 10px;
    }

    /* Info de la Canción */
    .song-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      text-align: center;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 12px;
      color: #8a8a9e;
      margin-bottom: 15px;
    }

    /* Barras de Progreso y Tiempo */
    .progress-container {
      width: 100%;
      padding: 0 10px;
    }
    .time-box {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #8a8a9e;
      margin-top: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #00f2fe;
    }

    /* Controles de Reproducción */
    .controls {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      margin-top: 15px;
    }
    .btn-ctrl {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .btn-main {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,114,255,0.4);
    }

    /* Lista de Reproducción */
    .playlist-panel {
      height: 120px;
      background: #14141d;
      border-top: 1px solid #2a2a3a;
      overflow-y: auto;
      padding: 5px;
    }
    .playlist-item {
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid #222230;
      display: flex;
      justify-content: space-between;
      color: #aaa;
    }
    .playlist-item.active {
      color: #00f2fe;
      font-weight: bold;
      background: rgba(0,242,254,0.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Lark iPod</h1>
    <label class="btn-file" for="audioInput">+ Cargar MP3</label>
    <input type="file" id="audioInput" accept="audio/mp3, audio/*" multiple onchange="cargarArchivos(event)">
  </header>

  <div class="player-screen">
    <div class="disc-container">
      <span class="disc-icon">🎧</span>
    </div>

    <!-- Visualizador de Barras de Ecualizador (Canvas) -->
    <canvas id="visualizer"></canvas>

    <div class="song-title" id="titulo">Selecciona una canción</div>
    <div class="song-artist" id="artista">Archivos locales .mp3</div>

    <!-- Barra de progreso de la canción -->
    <div class="progress-container">
      <input type="range" id="progressBar" value="0" min="0" max="100" onchange="cambiarProgreso()">
      <div class="time-box">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <!-- Botones estilo Lark Player -->
    <div class="controls">
      <button class="btn-ctrl" onclick="toggleBucle()" id="btnLoop">🔁</button>
      <button class="btn-ctrl" onclick="anteriorCancion()">⏮</button>
      <button class="btn-ctrl btn-main" onclick="togglePlay()" id="btnPlay">▶</button>
      <button class="btn-ctrl" onclick="siguienteCancion()">⏭</button>
      <button class="btn-ctrl" onclick="toggleAleatorio()" id="btnShuffle">🔀</button>
    </div>
  </div>

  <!-- Lista de canciones cargadas -->
  <div class="playlist-panel" id="playlist">
    <div style="text-align:center; font-size:11px; color:#666; padding-top:40px;">No hay canciones cargadas</div>
  </div>

  <!-- Elemento HTML5 de Audio oculto -->
  <audio id="audioPlayer"></audio>

  <script>
    // Variables ES5 compatibles con iOS 9.3.5
    var audio = document.getElementById('audioPlayer');
    var playlist = [];
    var indiceActual = 0;
    var esBucle = false;
    var esAleatorio = false;

    var canvas = document.getElementById('visualizer');
    var ctx = canvas.getContext('2d');

    // 1. Cargar canciones locales usando la API File
    function cargarArchivos(e) {
      var files = e.target.files;
      if (!files.length) return;

      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        playlist.push({
          nombre: file.name.replace(/\.[^/.]+$/, ""),
          url: URL.createObjectURL(file)
        });
      }

      renderizarPlaylist();
      if (playlist.length === files.length) {
        reproducirCancion(0);
      }
    }

    // 2. Renderizar la lista de reproducción
    function renderizarPlaylist() {
      var container = document.getElementById('playlist');
      container.innerHTML = '';

      for (var i = 0; i < playlist.length; i++) {
        var div = document.createElement('div');
        div.className = 'playlist-item' + (i === indiceActual ? ' active' : '');
        div.setAttribute('onclick', 'reproducirCancion(' + i + ')');
        div.innerHTML = '<span>' + (i + 1) + '. ' + escapeHTML(playlist[i].nombre) + '</span><span>MP3</span>';
        container.appendChild(div);
      }
    }

    // 3. Control de Reproducción
    function reproducirCancion(index) {
      if (index < 0 || index >= playlist.length) return;
      indiceActual = index;
      audio.src = playlist[indiceActual].url;
      audio.play();

      document.getElementById('titulo').innerText = playlist[indiceActual].nombre;
      document.getElementById('btnPlay').innerText = '⏸';
      renderizarPlaylist();
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        document.getElementById('btnPlay').innerText = '⏸';
      } else {
        audio.pause();
        document.getElementById('btnPlay').innerText = '▶';
      }
    }

    function siguienteCancion() {
      if (!playlist.length) return;
      if (esAleatorio) {
        var rand = Math.floor(Math.random() * playlist.length);
        reproducirCancion(rand);
      } else {
        var siguiente = (indiceActual + 1) % playlist.length;
        reproducirCancion(siguiente);
      }
    }

    function anteriorCancion() {
      if (!playlist.length) return;
      var anterior = (indiceActual - 1 + playlist.length) % playlist.length;
      reproducirCancion(anterior);
    }

    function toggleBucle() {
      esBucle = !esBucle;
      audio.loop = esBucle;
      document.getElementById('btnLoop').style.color = esBucle ? '#00f2fe' : '#fff';
    }

    function toggleAleatorio() {
      esAleatorio = !esAleatorio;
      document.getElementById('btnShuffle').style.color = esAleatorio ? '#00f2fe' : '#fff';
    }

    // 4. Barra de Progreso y Tiempos
    audio.ontimeupdate = function() {
      if (audio.duration) {
        var pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressBar').value = pct;
        document.getElementById('currentTime').innerText = formatearTiempo(audio.currentTime);
        document.getElementById('duration').innerText = formatearTiempo(audio.duration);
        dibujarEcualizadorFalso();
      }
    };

    audio.onended = function() {
      if (!esBucle) {
        siguienteCancion();
      }
    };

    function cambiarProgreso() {
      var val = document.getElementById('progressBar').value;
      if (audio.duration) {
        audio.currentTime = (val * audio.duration) / 100;
      }
    }

    function formatearTiempo(seg) {
      var m = Math.floor(seg / 60);
      var s = Math.floor(seg % 60);
      if (m < 10) m = '0' + m;
      if (s < 10) s = '0' + s;
      return m + ':' + s;
    }

    // 5. Animación de Ecualizador para iOS 9.3.5
    function dibujarEcualizadorFalso() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (audio.paused) return;

      var numBarras = 20;
      var anchoBarra = (canvas.width / numBarras) - 2;

      for (var i = 0; i < numBarras; i++) {
        var altoBarra = Math.random() * canvas.height;
        ctx.fillStyle = '#00f2fe';
        ctx.fillRect(i * (anchoBarra + 2), canvas.height - altoBarra, anchoBarra, altoBarra);
      }
    }

    function escapeHTML(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
